<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0a0d" />
    <title>Дорога в Навь</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a0d;
        /* Мобильный портрет — основной режим. Гасим системные жесты выделения. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
      }
      /* Прелоадер: показывается до старта Phaser, чтобы первый кадр не был чёрным. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0a0d;
        color: #c8352b;
        font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        transition: opacity 0.35s ease;
        z-index: 10;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Экран сбоя. Живёт в разметке, а не в игре: если сломалась игра,
         рисовать им же нечем. */
      #crash {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        box-sizing: border-box;
        background: #0b0a0d;
        color: #d8ccb4;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        z-index: 20;
      }
      #crash h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #b32d24;
      }
      #crash p {
        margin: 0;
        max-width: 30em;
        color: #8a7d66;
      }
      #crash button {
        margin-top: 8px;
        padding: 14px 28px;
        border: 1px solid #b8934a;
        border-radius: 28px;
        background: #14100c;
        color: #d8ccb4;
        font: inherit;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      #crash code {
        max-width: 34em;
        overflow-wrap: anywhere;
        font-size: 12px;
        color: #5c5344;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-8Yoy9XO9.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-CaWnzXme.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Дорога в Навь</div>
    <div id="crash">
      <h1>Дорога оборвалась</h1>
      <p>
        Что-то пошло не так, и игра не может продолжаться. Забег придётся начать
        заново — рекорды, летопись и подвиги при этом сохранятся.
      </p>
      <button type="button" id="crash-restart">Начать заново</button>
      <code id="crash-reason"></code>
    </div>
    <script>
      /*
       * Перехват сбоев. Стоит в разметке, а не в модуле игры, и намеренно:
       * сюда попадают и те ошибки, из-за которых модуль не загрузился вовсе,
       * а рисовать экран силами Phaser в такой момент нечем.
       *
       * Без этого любое исключение оставляло чёрный экран навсегда — худший
       * из возможных исходов там, где удержание влияет на выдачу.
       */
      (function () {
        // Требование площадки: правый клик и долгий тап по игровому полю
        // не должны открывать системное меню браузера — оно ломает и вид,
        // и жест удержания карты, который в игре уже занят своим смыслом.
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
        });

        var shown = false;

        function show(reason) {
          if (shown) return;
          shown = true;
          var boot = document.getElementById('boot');
          if (boot) boot.className = 'hidden';
          var box = document.getElementById('crash');
          box.style.display = 'flex';
          document.getElementById('crash-reason').textContent = String(reason || '').slice(0, 300);
        }

        document.getElementById('crash-restart').addEventListener('click', function () {
          // Сносим только забег. Рекорды и летопись копятся месяцами,
          // и стирать их из-за одной поломки нельзя.
          try {
            localStorage.removeItem('nav:run');
          } catch (e) {
            /* приватный режим — там и стирать нечего */
          }
          location.reload();
        });

        window.addEventListener('error', function (event) {
          show(event.message || event.error);
        });
        window.addEventListener('unhandledrejection', function (event) {
          show(event.reason);
        });
      })();
    </script>
  </body>
</html>
